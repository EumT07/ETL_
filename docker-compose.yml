services:
  database:
    image: postgres:17
    container_name: etl_process
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SQL-ETL/source/crm_data.csv:/tmp/crm_data.csv

volumes:
  postgres_data:
    driver: local